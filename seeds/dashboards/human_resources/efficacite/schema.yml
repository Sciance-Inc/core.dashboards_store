version: 2

seeds:
  - name: eff_categories_emploi
    description: Contient les regroupements des catégories d'emplois selon le corps d'emploi
    columns:
      - name: corp_empl
        description: Le numéro du corps d'emploi
        tests:
          - not_null
          - unique
      - name: description_corps_empl
        description: La description du corps d'emploi
        tests:
          - not_null
      - name: categorie
        description: La catégorie du corps d'emploi
        tests:
          - not_null
    config:
      column_types:
        corp_empl: nvarchar(16)
        description_corps_empl: nvarchar(32)
        categorie: nvarchar(64)

  - name: eff_categories_emploi_personnalises
    description: Contient les regroupements des catégories d'emplois selon le corps d'emploi
    columns:
      - name: corp_empl
        description: Le numéro du corps d'emploi
        tests:
          - not_null
          - unique
      - name: description_corps_empl
        description: La description du corps d'emploi
        tests:
          - not_null
      - name: categorie
        description: La catégorie du corps d'emploi
        tests:
          - not_null
    config:
      schema: dashboard_efficacite_seeds
      tags: efficacite
      column_types:
        corp_empl: nvarchar(16)
        description_corps_empl: nvarchar(32)
        categorie: nvarchar(64)

  - name: eff_reporting_configuration
    description: Contient les lieux jumelés utilisés par le tableau de bord.
    columns:
      - name: lieu_jumele
        description: L'id du lieu jumelé
        tests:
          - unique
      - name : is_school_comparable
        description: Booléen indiquant si le lieu jumelé s'affiche dans le tableau de bord
        tests:
          - not_null
      - name: nom_lieu_jumele
        description: Le nom du lieu jumelé à forcer dans `dim_mapper_paie`. Utile pour contourner / overrider la logique par défaut, notamment lorsque plusieurs écoles sont mappées au même lieu jumelé
      - name: categorie_lieu_jumele
        description: La catégorie du lieu jumelé à forcer dans `dim_mapper_paie`. Utile pour contourner / overrider la logique par défaut, notamment lorsque plusieurs écoles sont mappées au même lieu jumelé
    config:
      schema: dashboard_efficacite_seeds
      tags: efficacite
      column_types:
        lieu_jumele: nvarchar(3)
        is_school_comparable: bit
        nom_lieu_jumele: nvarchar(128)
        categorie_lieu_jumele: nvarchar(128)

  - name: eff_coefficients_premier_axes
    description: Contient les coefficients obligatoires pour le calcul du score de difficulté
    columns:
      - name: w_totaux_eleve
        description: Coefficient du nombre total d'élèves
        tests:
          - not_null
      - name: w_nb_difficulte
        description: Coefficient du nombre d'élèves en difficulté
        tests:
          - not_null
      - name: w_pi
        description: Coefficient du nombre d'élèves avec un PI
        tests:
          - not_null
    config:
      schema: dashboard_efficacite_seeds
      tags: efficacite
      column_types:
        w_totaux_eleve: float
        w_nb_difficulte: float
        w_pi: float

  - name: eff_mapping_fgj_paie
    description: Contient les écoles liant la paie à GPI
    columns:
      - name: lieu_trav
        description: Le numéro de l'école du côté de la paie
        tests:
          - unique
      - name: ecole_gpi
        description: Le numéro de l'école du côté de gpi
        tests:
          - unique
      - name: lieu_jumele
        description: L'école parent de l'école dite jumelée.
    config:
      schema: dashboard_efficacite_seeds
      tags: efficacite
      column_types:
        lieu_trav: nvarchar(3)
        ecole_gpi: nvarchar(3)
        lieu_jumele: nvarchar(3)
