      - name: annee
        description: The school year.
      - name: fiche
        description: Unique student file identifier.
      - name: id_mat_ele
        description: Unique subject-per-student-per-year identifier.
      - name: code_matiere
        description: Subject code.
      - name: groupe_matiere
        description: Subject group.
      - name: etat
        description: Subject state.
      - name: res_num_som
        description: Numeric subject result.
      - name: res_som
        description: Raw subject result.
      - name: res_meq
        description: MEQ result when available.
      - name: unites
        description: Number of units attached to the subject.
      - name: is_reprise
        description: Indicates whether the result is a retake.
      - name: is_reussite
        description: Indicates whether the result is a success.
      - name: is_echec
        description: Indicates whether the numeric result is below the success threshold.
      - name: is_difficulte
        description: Indicates whether the numeric result is between 60 and 69.
      - name: is_maitrise
        description: Indicates whether the numeric result is 70 or higher.
    tests:
      - resolution:
          combination_of_columns:
            - fiche
            - id_eco
            - is_reprise
            - code_matiere
            - groupe_matiere

