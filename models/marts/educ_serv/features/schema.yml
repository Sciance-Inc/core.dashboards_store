version: 2

models:
  - name: fact_resultat_bilan_competence
    config:
      tags:
        - res_scolaires
    description: >
      Lists end-of-year competency results for all students.
    columns:
      - name: annee
        description: The school year.
      - name: fiche
        description: Unique student file identifier.
      - name: id_eco
        description: Unique school identifier for a given year.
      - name: code_matiere
        description: Subject code.
      - name: groupe_matiere
        description: Subject group.
      - name: id_obj_mat
        description: Unique subject competency identifier.
      - name: no_comp
        description: Competency number within the subject.
      - name: etat
        description: Subject state.
      - name: res_comp
        description: Raw competency result.
      - name: res_num_comp
        description: Numeric competency result.
      - name: is_reprise
        description: Indicates whether the result is a retake.
      - name: is_reussite
        description: Indicates whether the result is a success.
      - name: is_echec
        description: Indicates whether the numeric result is below the success threshold.
      - name: is_difficulte
        description: Indicates whether the numeric result is between 60 and 69.
      - name: is_maitrise
        description: Indicates whether the numeric result is 70 or higher.
    tests:
      - resolution:
          combination_of_columns:
            - fiche
            - id_eco
            - is_reprise
            - code_matiere
            - no_comp
            - groupe_matiere

  - name: fact_resultat_bilan_matiere
    config:
      tags:
        - res_scolaires
    description: >
      Lists end-of-year subject results for all students.
