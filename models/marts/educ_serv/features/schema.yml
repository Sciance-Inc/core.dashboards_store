version: 2
models:
  - name: fact_yearly_student
    config:
      tags:
        - res_scolaires
    description: |-
      Groups spine students with school-year attributes used for filtering and reporting.
    columns:
      - name: code_perm
        description: |-
          Unique student permanent code.
      - name: id_eco
        description: |-
          Unique school identifier for a given year.
      - name: annee
        description: |-
          The school year.
      - name: fiche
        description: |-
          Unique student file identifier.
      - name: population
        description: |-
          Student population classification.
      - name: eco
        description: |-
          School code.
      - name: nom_ecole
        description: |-
          Formatted school name.
      - name: ordre_ens
        description: |-
          Order of education.
      - name: niveau_scolaire
        description: |-
          Student grade level.
    tests:
      - resolution:
          combination_of_columns:
            - code_perm
            - id_eco
            - annee
            - population
