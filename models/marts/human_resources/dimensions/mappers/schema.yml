version: 2
models:
  - name: dim_mapper_job_group
    description: |-
      This table maps each job group to a job group category. This dimension is designed to be overridden by the client to add custom job group categories.
    columns:
      - name: job_group
        description: |-
          The job group code. Use it to merge this dimension with a fact table.
        tests:
          - unique
          - not_null
      - name: job_group_description
        description: |-
          The job group description.
      - name: code_job_name
        description: |-
          The formatted job group code and name.
      - name: job_group_category
        description: |-
          The job group category.
  - name: dim_mapper_lieu_jumele
    description: |-
      This table maps each linked location to a friendly name and category.
    columns:
      - name: lieu_jumele
        description: |-
          Linked location identifier.
        tests:
          - unique
          - not_null
      - name: nom_lieu_jumele
        description: |-
          The linked location's friendly name.
        tests:
          - not_null
      - name: categorie_lieu_jumele
        description: |-
          The linked location category.
      - name: is_school_comparable
        description: |-
          Indicates whether the linked school can be used for school comparison.
  - name: dim_mapper_workplace
    description: |-
      This table maps each workplace to a friendly name. This dimension is designed to be overridden by the client to add consistent workplace name formatting.
    columns:
      - name: workplace
        description: |-
          The workplace id. Use it to merge this dimension with a fact table.
        tests:
          - unique
          - not_null
      - name: workplace_name
        description: |-
          The workplace's friendly name.
        tests:
          - not_null
