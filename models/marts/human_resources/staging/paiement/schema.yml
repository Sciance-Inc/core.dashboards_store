version: 2
models:
  - name: stg_hrs_calc
    description: |-
      Modèle de staging mart human_resources qui prépare les données intermédiaires sous le nom `stg_hrs_calc`. Sources dbt visibles dans le SQL: `i_pai_tab_corp_empl`, `i_pai_tab_stat_eng`.
  - name: stg_paiement_history
    description: |-
      Une table d'historique sur les paiements qu'un employé à reçu sur 3 ans. La table contient également des paiements provenant de la table des déductions.
    columns:
      - name: corp_empl
        description: |-
          Le numéro de l'emploi
      - name: total_mnt_brut
        description: |-
          Le montant total brut
      - name: total_hrs_brut
        description: |-
          Le nombre d'heure rémunéré
      - name: lieu_trav
        description: |-
          Le lieu de travail de l'emploi de l'employé
      - name: stat_eng
        description: |-
          Le statut de l'employé
    config:
      column_types:
        corp_empl: nvarchar(4)
        total_mnt_brut: decimal(5,3)
        total_hrs_brut: decimal(5,3)
        lieu_trav: nvarchar(3)
        stat_eng: nvarchar(2)
  - name: stg_paiement_history_employment_periods
    description: |-
      Table intermediaire technique materialisant les periodes d'emploi utilisees par stg_paiement_history pour eviter de recalculer l'historique avant la jointure temporelle.
  - name: stg_paiement_history_payment_groups
    description: |-
      Table intermediaire technique materialisant les paiements regroupes par cheque et code de paiement avant leur rattachement a l'historique d'emploi.
