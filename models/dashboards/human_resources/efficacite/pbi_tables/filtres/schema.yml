version: 2
models:
  - name: eff_report_filtres
    description: |-
      Table de rapport qui contient les paiements bruts agrégés des employés.
    columns:
      - name: filter_key
        description: |-
          La clé de filtre qui regroupe `annee` et `lieu_jumele`. Clé de liaison entre les tables.
      - name: annee
        description: |-
          L'année
      - name: annee_scolaire
        description: |-
          L'année scolaire
      - name: nom_lieu_jumele
        description: |-
          Le nom du lieu jumelé.
      - name: categorie_lieu_jumele
        description: |-
          La catégorie du lieu jumelé.
      - name: is_school_comparable
        description: |-
          Indique si le lieu peut être comparé dans le rapport.
      - name: _anomalie
        description: |-
          définit si un lieu est manquant
    config:
      column_types:
        filter_key: nvarchar(128)
        annee: nvarchar(4)
        annee_scolaire: nvarchar(12)
        nom_lieu_jumele: nvarchar(64)
        categorie_lieu_jumele: nvarchar(32)
        is_school_comparable: bit
        _anomalie: int
    tests:
      - resolution:
          combination_of_columns:
            - filter_key
      - max_le_zero:
          columns_to_verify:
            - _anomalie
