version: 2
models:
  - name: stg_hrs_calc
    description: |-
      Modèle de staging du tableau de bord Efficacité qui prépare les données intermédiaires sous le nom `stg_hrs_calc`. Sources dbt visibles dans le SQL: `i_pai_tab_corp_empl`, `i_pai_tab_stat_eng`.
  - name: stg_paiement_history
    description: |-
      Historique des paiements du dashboard Efficacité, issu des paiements regroupés
      et des périodes emploi. Il expose les montants et heures rémunérées par
      année, lieu jumelé, corps emploi et statut engagement, sans agrégation finale.
      Il est matérialisé dans le schéma du dashboard Efficacité.
    columns:
      - name: corp_empl
        description: |-
          Le numéro de l'emploi
      - name: total_mnt_brut
        description: |-
          Le montant total brut
      - name: total_hrs_brut
        description: |-
          Le nombre d'heure rémunéré
      - name: lieu_trav
        description: |-
          Le lieu de travail de l'emploi de l'employé
      - name: stat_eng
        description: |-
          Le statut de l'employé
    config:
      column_types:
        corp_empl: nvarchar(4)
        total_mnt_brut: decimal(5,3)
        total_hrs_brut: decimal(5,3)
        lieu_trav: nvarchar(3)
        stat_eng: nvarchar(2)
  - name: stg_paiement_history_employment_periods
    description: |-
      Staging du dashboard Efficacité matérialisant les periodes d'emploi utilisees par stg_paiement_history pour eviter de recalculer l'historique avant la jointure temporelle.
  - name: stg_paiement_history_payment_groups
    description: |-
      Staging du dashboard Efficacité matérialisant les paiements regroupes par cheque et code de paiement avant leur rattachement a l'historique d'emploi.
