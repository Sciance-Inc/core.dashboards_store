models:
  - name: prmrh_stg_lien_flag
    description: Liste des corps d'emploi avec leur description système provenant de la PAIE
    columns: 
      - name: corp_empl
        description: Le code du corps d'emploi
        tests:
          - not_null

    columns: 
      - name: date_deb
        description: La date de début du corps d'emploi
        tests:
          - not_null

    columns: 
      - name: date_fin
        description: La date de fin du corps d'emploi
        tests:
          - not_null

      - name: descr_corp_empl
        description: La description du code d'emploi selon les tables paie
        tests:
          - not_null

      - name: corp_empl_avec_descr
        description: Le code du corps d'emploi combiné avec la description provenant de la paie dans le format "code - (description)"
        tests:
          - not_null
        
      - name: categorie
        description: La catégorie du corps d'emploi
        tests:
          - not_null

      - name: dans_paie
        description: Indique si le corps d'emploi a au moins une paie enregistrée dans la BD PAIE. Booléen.
        tests:
          - not_null

      - name: is_termine
        description: Indique si la date de fin du corps d'emploi est passée. Booléen.
        tests:
          - not_null

    tests:
      - core_dashboards_store.resolution:
          combination_of_columns:
            - corp_empl
            - categorie