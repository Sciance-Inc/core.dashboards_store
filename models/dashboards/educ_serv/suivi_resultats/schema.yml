version: 2

models:
  - name: srslt_dim_matieres_suivi
    description: >
      Table de dimensions listant les codes matières et leur description.
      La table est construite en faisant l'union de la dimension par défaut (`core.dashboards_store/seeds/dashboards/educ_serv/suivi_resultats/default_tracked_courses.csv`) et de la dimension personnalisée (`cssXX.dashboards_store/seeds/dashboards/educ_serv/suivi_resultats/custom_tracked_courses.csv`).
      La table personnalisée peut être adaptée pour chaque CSS pour ajouter des matières.

  - name: srslt_report_portrait_eleve
    description: >
      Cette table donne un portrait de l'élève en combinant les résultats des compétences de base aux informations personnelles de l'élève.
    tests:
      - resolution:
          combination_of_columns:
            - annee
            - fiche
            - eco
            - niveau_res

  - name: srslt_report_suivi_resultats
    description: >
      Cette table permet d'obtenir les résultats historiques des cinq dernières années pour les élèves actuels, avec la possibilité de filtrer les élèves en difficulté, en maîtrise ou en échec.
    tests:
      - resolution:
          combination_of_columns:
            - id_eco
            - fiche
            - code_matiere
            - groupe_matiere
            - annee
            - no_comp
  - name: srslt_report_schools
    description: >
      Cette table donne une liste unique des écoles.
    tests:
      - resolution:
          combination_of_columns:
            - lieu_trav     
  - name: srlt_stg_semestrialisation_promomatiere_groupe_matiere
    description: >
      Cette table de staging a pour but d'optimiser l'exécution du script de la table `srslt_report_suivi_resultats`.
    tests:
      - resolution:
          combination_of_columns:
            - id_eco
            - fiche
            - code_matiere
            - groupe_matiere
            - annee
            - no_comp            
