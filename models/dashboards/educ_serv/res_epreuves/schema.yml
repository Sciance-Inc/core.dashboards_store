version: 2

models:
  - name: rstep_dim_epreuves
    description: >
      Table de dimensions mappant, pour chaque épreuve unique / obligatoire / maison, les codes matières, les no_competences et les cod_etapes requis.
      La table est construite en faisant l'union de la dimension par défaut (`core.dashboards_store/seeds/dashboards/educ_serv/res_epreuves/rstep_epreuves_communes.csv`) et de la dimension personnalisée (`cssXX.dashboards_store/seeds/dashboards/educ_serv/res_epreuves/rstep_epreuves_personnalisees.csv`).
      La table personnalisée peut être adaptée pour chaque CSS pour ajouter des épreuves.

  - name: rstep_fact_epreuves_obligatoires_internes
    description: >
      La table regroupe les notes des épreuves obligatoires et locales. 
      Cette table accumule les résultats pour les matières identifiées dans `rstep_dim_epreuves`.
    tests:
      - resolution:
          combination_of_columns:
            - fiche
            - ecole
            - code_matiere
            - annee_scolaire
            - description_matiere      
            - is_reprise
    columns:
      - name: res_comp_etape
        tests:
          - not_null

  - name: rstep_fact_epreuves_uniques
    description: >
      La table regroupe les notes des épreuves uniques de 4e et 5e secondaire.
      Cette table accumule les résultats pour les matières identifiées dans `rstep_liste_matiere_epr_unique`.
    tests:
      - resolution:
          combination_of_columns:
            - fiche
            - annee
            - code_matiere
            - mois_resultat
            - groupe
    columns:
      - name: res_ministere_final
        tests:
          - not_null   
  - name: rstep_report_liste_eleves_epreuves_uniques
    description: >
      Cette table liste toutes les informations liées à l'élève en relation avec les résultats aux épreuves uniques.
    tests:
      - resolution:
          combination_of_columns:
            - fiche
            - annee_scolaire
            - code_matiere
            - mois_resultat
  
  - name: rstep_report_liste_eleves_epreuves_obligatoires_internes
    description: >
      Cette table liste toutes les informations liées à l'élève en relation avec les résultats aux épreuves obligatoires et locales.
    tests:
      - resolution:
          combination_of_columns:
            - fiche
            - annee_scolaire
            - description_matiere
            - is_reprise

  - name: rstep_stg_resultats_ministere
    description: >
      Cette table liste les résultats aux épreuves uniques au niveau régional et provincial. 
    tests:
      - resolution:
          combination_of_columns:
            - annee_scolaire
            - mois_resultat
            - code_matiere
            - ecole          
