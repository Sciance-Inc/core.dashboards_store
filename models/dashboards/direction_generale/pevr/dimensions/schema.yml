version: 2
models:
  - name: pevr_dim_cibles_annuelles
    description: |-
      Table de dimension qui mappe les données prévisionnelles. La table est construite en faisant l'union de la dimension commune (`core.dashboards_store/seeds/dashboards/direction_generale/pevr/cibles_indicateurs_annuelles_pevr.csv`) et de la dimension personnalisée (`cssXX.dashboards_store/seeds/dashboards/direction_generale/pevr/custom_cibles_indicateurs_annuelles_pevr.csv`).
    columns:
      - name: id_indicateur_meq
        description: |-
          Identifiant MEQ unique de l'indicateur.
        tests:
          - not_null
      - name: id_indicateur_css
        description: |-
          Identifiant CSS unique de l'indicateur si l'id est différent du MEQ.
      - name: annee_scolaire
        description: |-
          L'année scolaire
      - name: cible
        description: |-
          La cible qu'on veut atteindre (%)
    tests:
      - core_dashboards_store.resolution:
          combination_of_columns:
            - id_indicateur_meq
            - annee_scolaire
  - name: pevr_dim_indicateur_charl
    description: |-
      Table de dimension qui mappe les indicateurs des données de Charlemagne communs avec les indicateurs des données de Charlemagne personnalisés. La table est construite en faisant l'union de la dimension commune (`core.dashboards_store/seeds/dashboards/direction_generale/pevr/indicateurs_pevr_charl.csv`) et de la dimension personnalisée (`cssXX.dashboards_store/seeds/dashboards/direction_generale/pevr/custom_indicateurs_pevr_charl.csv`).
    columns:
      - name: id_indicateur_meq
        description: |-
          Identifiant MEQ unique de l'indicateur.
      - name: id_indicateur_css
        description: |-
          Identifiant CSS unique de l'indicateur si l'id est différent du MEQ.
      - name: annee_scolaire
        description: |-
          L'année scolaire
      - name: taux
        description: |-
          Le résultat.
      - name: cible
        description: |-
          La cible qu'on veut atteindre (%)
    config:
      column_types:
        id_indicateur_meq: nvarchar(max)
        id_indicateur_css: nvarchar(max)
        annee_scolaire: nvarchar(max)
        taux: float
        cible: float
  - name: pevr_dim_indicateurs
    description: |-
      Table de dimension qui mappe les indicateurs communs avec les indicateurs personnalisés. La table est construite en faisant l'union de la dimension commune (`core.dashboards_store/seeds/dashboards/direction_generale/pevr/indicateurs_pevr_meq.csv`) et de la dimension personnalisée (`cssXX.dashboards_store/seeds/dashboards/direction_generale/pevr/custom_indicateurs_pevr_meq.csv`).
    columns:
      - name: objectif
        description: |-
          Identifiant MEQ unique de l'indicateur.
      - name: id_indicateur_meq
        description: |-
          Identifiant MEQ unique de l'indicateur.
      - name: id_indicateur_css
        description: |-
          Identifiant CSS unique de l'indicateur si l'id est différent du MEQ.
      - name: description_indicateur
        description: |-
          Description textuelle de l'indicateur
      - name: code_matiere
        description: |-
          Le résultat.
      - name: no_competence
        description: |-
          Le numéro de compétence de la matière (`code_matiere`)
    config:
      column_types:
        objectif: nvarchar(max)
        id_indicateur_meq: nvarchar(max)
        id_indicateur_css: nvarchar(max)
        description_indicateur: nvarchar(max)
        code_matiere: nvarchar(max)
        no_competence: nvarchar(max)
